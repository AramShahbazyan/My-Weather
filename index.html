<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Set the theme before the page paints, so there's no flash of the
    // wrong theme. Uses the user's saved choice, or their system setting
    // if they haven't chosen one yet.
    (function () {
      var saved = localStorage.getItem("theme");
      var theme =
        saved ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <div id="weather-fx" aria-hidden="true"></div>

  <main class="card">
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Toggle dark mode"
    ></button>
    <h1>Weather</h1>

    <form id="search-form" class="search-form">
      <input
        type="text"
        id="city-input"
        placeholder="Enter a city (e.g. Yerevan)"
        autocomplete="off"
        required
      />
      <button type="submit">Search</button>
    </form>

    <p id="status" class="status"></p>

    <section id="result" class="result hidden">
      <div class="result-top">
        <img id="icon" src="" alt="" width="64" height="64" />
        <div>
          <p id="location" class="location"></p>
          <p id="updated" class="updated"></p>
        </div>
      </div>

      <p id="temp" class="temp"></p>
      <p id="condition" class="condition"></p>

      <div class="details">
        <div class="detail">
          <span class="detail-label">Feels like</span>
          <span id="feelslike" class="detail-value"></span>
        </div>
        <div class="detail">
          <span class="detail-label">Humidity</span>
          <span id="humidity" class="detail-value"></span>
        </div>
        <div class="detail">
          <span class="detail-label">Wind</span>
          <span id="wind" class="detail-value"></span>
        </div>
      </div>

      <div id="forecast" class="forecast"></div>

      <div id="mascot" class="mascot hidden">
        <span id="mascot-face" class="mascot-face"></span>
        <p id="mascot-tip" class="mascot-tip"></p>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
